      type: object
      description: "The filter DSL of 02 section 9: `match` (`all` or `any`) over `conditions`, each a condition\n`{field, op, value}` (`value` absent for operators that take none) or a group `{match, conditions}` of plain\nconditions (one level of nesting). At most 20 conditions and 5 groups. Fields are `first_name`, `last_name`,\n`display_name`, `email`, `custom.<key>`, `group`, `identity.country`, `identity.type`, `source`, `created_at`,\n`last_inbound_at`, `last_outbound_at`, `opted_out` and `campaign`, with the operators and values of 02 section 9.2.\nGroup and campaign ids must belong to the account.\n"
