  '/devices/{id}/revoke':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: devices.revoke
      tags:
        - Devices
      summary: 'Revoke (unpair) a device'
      description: "Requires `channels:write`. `status: revoked` with `revoked_reason: owner` (`partner` when a partner key calls\nit). Its channels become `paused` with `pause_reason: device_revoked`. Messages the phone holds are not\nre-queued: their leases are orphaned and the phone may still report them until `drain_until` (= `revoked_at` +\n24 h); any still unresolved then fail with `UNCONFIRMED`. The phone gets no further leases, its next heartbeat\ncarries an `unpair` action, and after `drain_until` every device call gets `410 DEVICE_REVOKED`. Emits\n`device.revoked`. Revoking a revoked device returns it unchanged.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 'The revoked device.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        401:
