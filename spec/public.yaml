        -
          name: channel_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: conversation_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: contact_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: campaign_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: direction
          in: query
          description: '`outbound` or `inbound`.'
          schema:
            type: string
        -
          name: reference_id
          in: query
          description: 'Exact match; returns 0 or 1 item.'
          schema:
            type: string
        -
          name: status
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: type
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: category
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: lane
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: origin
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: failure_code
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: channel_type
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: content_type
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: hold_reason
          in: query
          description: 'Comma list.'
          schema:
            type: string
        -
          name: to
          in: query
          description: 'Recipient address; phone numbers in any accepted format are normalised.'
          schema:
