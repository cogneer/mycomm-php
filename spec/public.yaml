        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/messages/{id}/retry':
    post:
      operationId: messages.retry
      tags:
        - Messages
      summary: 'Retry a message'
      description: "Re-queues the same message (same id, `reference_id` and conversation position) from `failed` or `expired`\n(03 section 3.1, 02 section 6.5). Requires `messages:send`. `attempts` is reset, the failure fields are cleared and\n`expires_at` is set to now plus the lane default. Compliance and channel and account state are checked again.\n`acknowledge_possible_duplicate` must be `true` to retry a message whose `failure.code` is `UNCONFIRMED`; it is ignored otherwise.\nErrors: `409 NOT_RETRYABLE` (`details.status`, `details.failure_code`; not `failed` or `expired`, inbound, or `UNCONFIRMED`\nwithout acknowledgement), `409 RETRY_LIMIT_REACHED` (5 manual retries), and `422` `RECIPIENT_OPTED_OUT`, `CONTACT_BLOCKED`,\n`CHANNEL_INACTIVE` or `INBOX_ARCHIVED`. A message outside the key's inbox scope answers 404. Send `{}` when there is nothing to acknowledge.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
