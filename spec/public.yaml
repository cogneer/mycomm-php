            - admin
            - account_suspended
            - 'auto:health_critical'
            - 'auto:quarantine'
            - 'auto:quota'
            - 'auto:sim_missing'
            - device_revoked
            - 'auto:failure_streak'
            - 'auto:session_lost'
            - 'auto:provider_banned'
            - 'auto:credentials_invalid'
            - null
        paused_at:
          description: 'When the current pause began.'
