        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        200:
          description: 'The message, now `cancelled`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
