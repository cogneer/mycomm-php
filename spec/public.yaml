      description: "Requires `media:write`. `multipart/form-data` with one part `file` of at most 10 MB (03 section 3.2). The type is\nsniffed from the content (`image/jpeg`, `image/png`, `image/gif`, `image/webp`), never taken from the header or\nthe file name. The upload is stored with `purpose: message`; reference its `id` from a message. An upload still\nunattached after 24 hours is deleted. Rate limit: 60 requests per minute per account.\n\nErrors: `413 PAYLOAD_TOO_LARGE` (over 10 MB), `422 MEDIA_TYPE_UNSUPPORTED`, `422 VALIDATION_FAILED` (no `file` part).\n"
