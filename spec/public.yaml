                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  group_by:
                    type: string
                    enum:
                      - none
                      - channel
                      - inbox
                      - channel_type
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyStatsRow'
                  next_cursor:
                    type:
                      - string
                      - 'null'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /stats/summary:
    get:
      operationId: stats.summary
      tags:
        - Reports
      summary: 'Period summary and live state'
      description: "Requires `reports:read`. One call for a dashboard header (03 section 3.14). `totals` are sums of\n`usage_daily` over the inclusive range (calendar days in the account time zone, at most 366 days:\n`422 RANGE_TOO_LARGE`, details `{max_days: 366}`). `delivery_rate` is delivered over sent on channels with\ndelivery reports; `read_rate` is `null` when the account has no read-capable channel; a rate is `null`\nwhen there is nothing to divide by. `failures_by_code` counts outbound messages whose `failed_at` falls in\nthe range. `queue_now`, `channels` and `devices` are current counts. A key restricted to inboxes gets\nfigures for its inboxes, channels and devices only.\n"
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: Summary.
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /suppressions:
    get:
      operationId: suppressions.list
      tags:
        - Suppressions
      summary: 'List suppressions'
      description: "Requires `suppressions:read`. The account's suppressed identities, newest first, with cursor pagination\n(03 sections 2.5 and 3.10). Suppressions belong to the account, not to an inbox: a restricted key sees the\nwhole list. Comma lists match any of the values. A phone number in `address` written without country code is\nread in the account country. Only `marketing` traffic is blocked by a suppression.\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
        -
          name: address
          in: query
          description: 'Suppressed address, E.164 for phone numbers (comma list).'
          schema:
            type: string
        -
          name: reason
          in: query
          description: 'Comma list of `keyword`, `manual`, `import`, `api`, `complaint`, `dnc`, `invalid`.'
          schema:
            type: string
        -
          name: created_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          description: 'Exclusive upper bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - '-created_at'
              - created_at
            default: '-created_at'
      responses:
        200:
          description: 'A page of suppressions.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Suppression'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: suppressions.create
      tags:
        - Suppressions
      summary: 'Suppress a number'
      description: "Requires `suppressions:write` (never held by a restricted key, 03 section 2.2). `identity_type` defaults to\n`phone` (the only type in v1) and `reason` to `api`; the API may write `api`, `complaint` or `dnc`. The address\nis stored in E.164 (a number without country code is read in the account country; one that is not a valid\nnumber is `422 VALIDATION_FAILED` with `INVALID_NUMBER` on `address`). A new suppression answers `201`, writes\na `consent_events` `opt_out` (method `api`) and emits `contact.opted_out`; the identity's queued marketing is\ncancelled. A number that is already suppressed, for any reason, answers `200` with the existing row unchanged.\nWith the account setting `opt_out.scope: contact`, a number that belongs to a contact suppresses every identity\nof that contact not suppressed yet, each with its own consent event and `contact.opted_out`, as a STOP reply\ndoes; the answer is still the row of the number given.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionCreateRequest'
      responses:
        200:
          description: 'The number was already suppressed; the existing suppression.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppression'
        201:
          description: 'The new suppression.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppression'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/suppressions/{id}/remove':
    post:
      operationId: suppressions.remove
      tags:
        - Suppressions
      summary: 'Remove a suppression'
      description: "Requires `suppressions:write`. Deletes the suppression, writes a `consent_events` `opt_in` (method `api`, the\nnote) and emits `contact.opted_in`; the `opt_out` consent event stays (the consent trail is append-only).\n`consent_note` is required when the suppression's `reason` is `keyword`: without it the answer is\n`422 CONSENT_NOTE_REQUIRED` and the number stays suppressed (02 section 11.3). `204`. A suppression that is\nabsent or in another account is `404`.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionRemoveRequest'
      responses:
        204:
          description: 'The suppression is removed.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /suppressions/check:
    get:
      operationId: suppressions.check
      tags:
        - Suppressions
      summary: 'Check whether an address is suppressed'
      description: "Requires `suppressions:read`. `address` is the E.164 number (a number without country code is read in the\naccount country; one that is not a valid number is `422 VALIDATION_FAILED` with `INVALID_NUMBER` on\n`address`). `identity_type` defaults to `phone`. The answer echoes the normalised address.\n"
      parameters:
        -
          name: address
          in: query
          required: true
          description: 'The address to check, e.g. `+923451234567`.'
          schema:
            type: string
        -
          name: identity_type
          in: query
          schema:
            type: string
            enum:
              - phone
              - sender_id
              - whatsapp
              - telegram
            default: phone
      responses:
        200:
          description: 'Whether the address is suppressed, with the suppression when it is.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionCheck'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /consent-events:
    get:
      operationId: consentEvents.list
      tags:
        - Suppressions
      summary: 'List consent events'
      description: "Requires `suppressions:read`. The account's consent audit trail, newest first, with cursor pagination (03\nsections 2.5 and 3.10): every `opt_out` and `opt_in` with its method, keyword, message, actor and note. The trail\nis append-only; it outlives the suppression it records and the contact's erasure. Comma lists match any of\nthe values. A phone number in `address` written without country code is read in the account country.\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
        -
          name: address
          in: query
          description: 'E.164 for phone numbers (comma list).'
          schema:
            type: string
        -
          name: event
          in: query
          description: 'Comma list of `opt_out`, `opt_in`.'
          schema:
            type: string
        -
          name: method
          in: query
          description: 'Comma list of `keyword`, `manual`, `api`, `import`, `campaign_form`.'
          schema:
            type: string
        -
          name: created_after
          in: query
          description: 'Inclusive lower bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          description: 'Exclusive upper bound.'
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - '-created_at'
              - created_at
            default: '-created_at'
      responses:
        200:
          description: 'A page of consent events.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConsentEvent'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-endpoints/{id}/deliveries':
