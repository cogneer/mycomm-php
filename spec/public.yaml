      summary: 'Create a pairing code'
      description: "Requires `channels:write` (03 section 3.11.1). The code is 8 Crockford base32 characters, single\nuse and valid for 10 minutes. At most 20 codes are pending and 60 are created per account per hour\n(`422 PAIRING_CODE_LIMIT_REACHED` with `retry_after_seconds`). Render `qr_payload` as-is as a QR code.\n"
      requestBody:
