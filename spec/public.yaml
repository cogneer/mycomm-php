              $ref: '#/components/schemas/Timestamp'
            -
              type: 'null'
        disconnect_reason:
          type:
            - string
            - 'null'
          description: 'Set when `disconnected` (01 section 4.2).'
          enum:
            - owner
            - admin_force_release
            - account_deleted
            - declined_on_device
            - sim_retired
            - device_revoked
            - sim_removed
            - session_lost
            - provider_banned
            - credentials_invalid
            - null
        device_id:
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        device_sim_id:
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        main_inbox_id:
          description: "The channel's main inbox; `null` until the number is connected."
          oneOf:
            -
              $ref: '#/components/schemas/Uuid'
            -
              type: 'null'
        capabilities:
          $ref: '#/components/schemas/ChannelCapabilities'
        allowed_destination_countries:
          description: "ISO 3166-1 alpha-2 codes; `null` means the channel's own country only."
          oneOf:
            -
              type: array
              items:
                type: string
            -
              type: 'null'
        skip_business_senders:
          type: boolean
        rate_policy:
          $ref: '#/components/schemas/ChannelRatePolicy'
        rate_policy_source:
          type: string
          enum:
            - suggested
            - custom
        rate_policy_risk:
          type: string
          description: 'Risk of the stored policy against the suggestion (02 section 2.8).'
          enum:
