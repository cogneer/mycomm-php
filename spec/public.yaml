                      $ref: '#/components/schemas/Import'
                  next_cursor:
                    type:
                      - string
                      - 'null'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
