          $ref: '#/components/schemas/Uuid'
    post:
      operationId: devices.pause
      tags:
        - Devices
      summary: 'Pause a device'
      description: "Requires `channels:write`. The device gets no further leases (`paused: true`, `pause_reason: owner`); the app\nreleases its buffered messages and the messages of its channels wait with `hold_reason: device_paused`. A device\nalready paused keeps its reason. A revoked device is `409 INVALID_STATE`.\n"
      parameters:
