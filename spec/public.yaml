          $ref: '#/components/parameters/cursor'
        -
          name: status
          in: query
          schema:
            type: string
        -
          name: event_type
          in: query
          schema:
            type: string
        -
          name: event_id
          in: query
          schema:
            type: string
        -
          name: created_after
          in: query
          schema:
            type: string
            format: date-time
        -
          name: created_before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        200:
          description: 'A page of deliveries.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
