    post:
      operationId: devices.resume
      tags:
        - Devices
      summary: 'Resume a paused device'
      description: "Requires `channels:write`. Ends a pause with `pause_reason: owner`; an `admin` pause ends only through MyComm\nand an `account_suspended` pause only when the account is reactivated (`409 INVALID_STATE`). A device that is not\npaused is returned unchanged.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 'The resumed device.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        401:
