    patch:
      operationId: devices.update
      tags:
        - Devices
      summary: 'Rename a device or record its OS-limit raise'
      description: "Requires `channels:write` (03 section 3.11.2); a key restricted to inboxes never holds it. Changes only the keys\nsent. `name` is 1 to 60 characters. `os_limit_raised: true` records the owner's confirmation that the Android\nSMS limit was raised with ADB on this phone and needs `os_limit_value` (31 to 100,000); `false` clears the\nvalue. Either change sets `os_limit_changed_at` (the later write wins over a confirmation from the app), is\naudit-logged as `device.os_limit.updated` and applies to the pacing of the device's channels at once. A revoked\ndevice is `409 INVALID_STATE`. `404` when the device is outside the key's scope.\n"
      requestBody:
        required: true
        content:
          application/json:
