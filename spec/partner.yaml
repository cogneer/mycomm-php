paths:
  /usage:
    get:
      operationId: partner.usage.get
      tags:
        - Usage
      summary: 'Usage across managed accounts'
      description: "Dates are interpreted in each account's own time zone (as stored in `usage_daily`). Paginated over\naccounts, sorted by `sent_segments` descending. Counters are those of 03 section 3.14; rows and\ntotals add `by_channel_type`. Per-day detail for one account: `GET /v1/stats/daily` acting as it.\n"
      parameters:
        -
          name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        -
          name: account_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'Totals and a page of per-account rows.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /accounts:
    post:
      operationId: partner.accounts.provision
      tags:
        - 'Managed accounts'
      summary: 'Provision a managed account'
      description: "Idempotent by `external_ref` (03 section 4.2). `201` creates a managed account with no users;\n`channels.auto_connect_sims` defaults to `true`. `200` returns the existing account with this\n`external_ref` **unchanged**, also when it is `pending_deletion` (the request's other fields are\nignored; use `PATCH`). Concurrent duplicates resolve to one account. Keys with\n`allowed_account_ids` get `403 PARTNER_KEY_RESTRICTED`; read-only keys `403 ABILITY_MISSING`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionAccountRequest'
      responses:
        201:
          description: 'A new managed account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        200:
          description: 'The existing account with this `external_ref`, unchanged.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: '403 PARTNER_KEY_RESTRICTED (`details.reason: account_list`, the key has `allowed_account_ids`), ABILITY_MISSING (read-only key), WRONG_KEY_KIND, IP_NOT_ALLOWED or PARTNER_ACCESS_REVOKED.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: partner.accounts.list
      tags:
        - 'Managed accounts'
      summary: 'List managed accounts'
      description: 'A key with `allowed_account_ids` lists only those accounts.'
      parameters:
        -
          name: external_ref
          in: query
          description: 'Exact match.'
          schema:
            type: string
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
              - pending_deletion
        -
          name: q
          in: query
          description: 'Matches the name.'
          schema:
            type: string
        -
          name: created_after
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: created_before
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        -
          name: needs_attention
          in: query
          description: '`true` for accounts with `counts.channels_needing_attention` above zero.'
          schema:
            type: boolean
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - '-created_at'
              - name
            default: '-created_at'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of managed accounts.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManagedAccount'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/accounts/{id}':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
    get:
      operationId: partner.accounts.get
      tags:
        - 'Managed accounts'
      summary: 'Get a managed account'
      responses:
        200:
          description: 'The account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: partner.accounts.update
      tags:
        - 'Managed accounts'
      summary: 'Update a managed account'
      description: "`settings` is deep-merged with the rules of `PATCH /v1/account`, plus `limits.max_daily_segments`\nand `channels.allowed_types`, which only the partner may set. The new `name` appears in the\npaired app. A taken `external_ref` is `409 EXTERNAL_REF_TAKEN`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAccountUpdate'
      responses:
        200:
          description: 'The updated account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: '409 EXTERNAL_REF_TAKEN: another account of this partner has the `external_ref`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: partner.accounts.delete
      tags:
        - 'Managed accounts'
      summary: 'Schedule deletion of a managed account'
      description: "Cancels queued messages and unfinished campaigns first, then revokes devices and account keys and\ndisconnects channels (03 section 4.2). Emits `account.deletion_scheduled`. `reactivate` before\n`purge_at` (14 days) restores the data.\n"
      responses:
        202:
          description: 'The account, `status: pending_deletion` with `purge_at`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/accounts/{id}/suspend':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
    post:
      operationId: partner.accounts.suspend
      tags:
        - 'Managed accounts'
      summary: 'Suspend a managed account'
      description: '`status: suspended`; `/v1` writes then get `403 ACCOUNT_SUSPENDED`. Emits `account.suspended`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        200:
          description: 'The suspended account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/accounts/{id}/reactivate':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
    post:
      operationId: partner.accounts.reactivate
      tags:
        - 'Managed accounts'
      summary: 'Reactivate a managed account'
      description: 'From `suspended`, or from `pending_deletion` before `purge_at`. Emits `account.reactivated`. A suspension set by MyComm support or a kill switch is not lifted by a partner (409 SUSPENDED_BY_SUPPORT).'
      responses:
        200:
          description: 'The reactivated account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAccount'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/accounts/{id}/api-keys':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
    get:
      operationId: partner.accountKeys.list
      tags:
        - 'Account keys'
      summary: "List a managed account's keys"
      description: 'The same resource as `GET /v1/api-keys` (03 section 3.13). The token is never returned here.'
      parameters:
        -
          name: revoked
          in: query
          description: 'Default `false`.'
          schema:
            type: boolean
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of keys.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ListEnvelope'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: partner.accountKeys.create
      tags:
        - 'Account keys'
      summary: 'Mint an account key for a managed account'
      description: "Same body and `201` response as `POST /v1/api-keys`, unrestricted or restricted to inboxes or channel\ntypes, with any abilities. The `token` is shown once, in this response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        201:
          description: 'The new key, including its `token`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ApiKey'
                  -
                    type: object
                    required:
                      - token
                    properties:
                      token:
                        type: string
                        description: 'The plaintext key; returned only here.'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/accounts/{id}/api-keys/{key_id}':
    parameters:
      -
        $ref: '#/components/parameters/AccountId'
      -
        name: key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    delete:
      operationId: partner.accountKeys.revoke
      tags:
        - 'Account keys'
      summary: "Revoke a managed account's key"
      description: "Revokes immediately; the key's next call is `401`. Revoking a revoked key is a no-op."
      responses:
        204:
          description: 'The key is revoked.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
