    get:
      operationId: pairingCodes.get
      tags:
        - Phones
      summary: 'Get a pairing code'
      description: "Requires `channels:read`. Poll every 3 to 5 seconds while the QR is displayed, or wait for\n`device.paired`. `code` and `qr_payload` are `null` here because the code is stored hashed.\n"
