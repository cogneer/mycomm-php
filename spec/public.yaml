        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledge_possible_duplicate:
                  type: boolean
                  description: 'Must be `true` to retry a message that failed with `UNCONFIRMED` (it may already have been delivered).'
      responses:
        200:
          description: 'The message, `queued` again.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /messages/batch:
    post:
      operationId: messages.sendBatch
      tags:
        - Messages
      summary: 'Send up to 1,000 messages'
      description: "Sends 1-1,000 messages in one call (03 section 3.1). Requires `messages:send`. Each item has the fields of\n`POST /v1/messages` except `dry_run`; `defaults` supplies any field an item omits and the item's value wins.\n`category` is required on every item, in the item or in `defaults` (there is no implicit `transactional` here).\n\nItems are accepted or rejected independently, in order: the answer is always `200` with a `summary` and one\n`results[]` entry per item, also when every item was rejected. An item error carries the code of the matching single\nsend (`INVALID_NUMBER`, `CATEGORY_REQUIRED`, `RECIPIENT_OPTED_OUT`, ...). A `reference_id` already used by the\naccount, or earlier in the same batch, rejects that item with `REFERENCE_ID_EXISTS`.\n\n`Idempotency-Key` covers the whole batch: a repeat replays the stored `200`. `dry_run: true` runs every item through\nthe same checks and stores nothing; accepted entries then carry a message preview with `id` and `status` null.\n\nEnvelope problems answer `422` and nothing is processed: `BATCH_TOO_LARGE` (`details.max`, 1,000) or\n`VALIDATION_FAILED`.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBatchRequest'
      responses:
        200:
          description: 'Per-item results and a summary, also when every item was rejected.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendBatchResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          description: '`IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        422:
          description: '`BATCH_TOO_LARGE` (`details.max`) or `VALIDATION_FAILED`; nothing was processed.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          $ref: '#/components/responses/RateLimited'
  /messages:
    post:
      operationId: messages.send
      tags:
        - Messages
      summary: 'Send one message'
      description: "Queues one message (03 section 3.1, 07 section 5). Requires `messages:send`. The inbox decides the channel: give\n`inbox_id`, `channel_id` or `from` (the key's single inbox is used when it is restricted to exactly one).\nThe recipient is `to` or `contact_id`. The content is the `content` union or one of the shorthand fields\n(`body`, `media_ids`).\n\nAnswers `202` with the message resource (`status: queued`) plus `warnings[]` (empty when none; for example\n`CHANNEL_OPTIONS_IGNORED`). A message is accepted while the phone is offline or the channel is paused; it waits\nwith `hold_reason` `device_offline`, `device_paused` or `channel_paused`.\n\n`Idempotency-Key` replays the stored `202` for the same request. A `reference_id` already used by the account\nwithout a matching key answers `409 REFERENCE_ID_EXISTS` with `details.message_id` and the existing message in\n`details.message`; nothing is created. Every acceptance rejection of 02 section 6.4 answers `422` with its own code\n(`CATEGORY_REQUIRED`, `SEND_AFTER_TOO_FAR`, `INVALID_NUMBER`, `RECIPIENT_OPTED_OUT`, `CHANNEL_INACTIVE`, ...) and the\n`details` of 03 section 2.6.1. Shape errors (including `metadata` over 2 KB or 50 keys, or non-scalar values) answer\n`422 VALIDATION_FAILED` with `details.fields`. An inbox, channel or contact outside the key's scope answers 404.\n\nWith `dry_run: true` (03 section 3.1.1) the same validation and acceptance errors apply, but nothing is stored,\nqueued or sent and the answer is `200` with the would-be message: `dry_run: true`, `id`, `conversation_id`,\n`status` and the timestamps `null`, `contact_id` `null` for a new number, and the computed `encoding`,\n`segments`, `type`, `hold_reason` and `expires_at`. `hold_reason` predicts compliance and scheduling holds only.\n`Idempotency-Key` and `reference_id` are checked but not consumed.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        200:
          description: 'Dry run only. The would-be message plus the non-fatal warnings; nothing was written.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageDryRunResponse'
        202:
          description: 'The message, queued, plus the non-fatal warnings.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: '`REFERENCE_ID_EXISTS` (`details.message_id`, `details.message`), `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: messages.list
      tags:
        - Messages
      summary: 'List and search messages'
      description: "Messages of the account, newest first, with cursor pagination (03 sections 2.5 and 3.1). Requires `messages:read`.\nA restricted key lists only the messages of its inboxes. Comma lists match any of the values.\n`q` is a full-text search on `body` (at least 2 characters, Postgres `simple` configuration, so Urdu and Roman Urdu\nmatch word by word) and always sorts newest first.\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
        -
          name: inbox_id
