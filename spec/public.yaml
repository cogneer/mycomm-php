      description: "Cancels a `queued` message, held and scheduled ones included (03 section 3.1). Requires `messages:send`.\nAnswers `200` with the message in `status: cancelled`. A `leased` message is already on the phone, so the\ncall is a best-effort cancel request: `202` with the message still `leased` and `cancel_requested_at` set;\nthe phone's later report decides the outcome. A `sent` or other terminal message answers `409 NOT_CANCELLABLE`\nwith `details.status`. A message outside the key's inbox scope answers 404. Send an empty JSON object `{}` as the body.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
