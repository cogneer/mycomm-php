      tags:
        - Exports
      summary: 'List exports'
      description: "Requires the ability of at least one export type; the list holds only the exports of types the key may request,\nnewest first. List rows carry no signed download URL: `url` and `url_expires_at` are `null` here, even for a\n`completed` export. Fetch the export with `GET /v1/exports/{id}` to get a `url` signed for 15 minutes.\n"
      parameters:
        -
          name: type
          in: query
          schema:
            $ref: '#/components/schemas/ExportType'
        -
          name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExportStatus'
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of exports.'
