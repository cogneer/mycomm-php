        buttons:
          type: boolean
        location:
          type: boolean
        business_initiated:
          type: boolean
        session_window_seconds:
          type:
            - integer
            - 'null'
        groups:
          type: boolean
    Channel:
      type: object
      description: 'A number (an `android_sim` channel in v1) with its full state (03 section 3.11.4).'
      required:
        - id
        - type
        - name
        - address
        - display_address
        - status
        - pause_reason
        - paused_at
        - disconnect_reason
        - device_id
        - device_sim_id
        - main_inbox_id
        - capabilities
        - allowed_destination_countries
        - skip_business_senders
        - rate_policy
        - rate_policy_source
        - rate_policy_risk
        - suggested_rate_policy
        - rate_policy_ceiling
        - warmup
        - health
        - queue
        - usage
        - reply_window_days
        - throttled_until
        - verification
        - verified_at
        - connected_at
        - disconnected_at
        - created_at
      properties:
        id:
