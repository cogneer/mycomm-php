    post:
      operationId: conversations.reply
      tags:
        - Conversations
      summary: 'Reply in a conversation'
      description: "Sends a message in the thread (03 section 3.3). Requires `conversations:write` and `messages:send`. The body is the\nbody of `POST /v1/messages` without `to`, `contact_id`, `inbox_id`, `channel_id`, `from` and `channel_type`; the\ninbox and contact identity of the conversation are used. Sending one of those fields answers\n`422 VALIDATION_FAILED` with the field in `details.fields`.\n\nEverything else behaves as on `POST /v1/messages`: `202` with the message resource plus `warnings[]`, `dry_run`,\n`Idempotency-Key`, `reference_id` (`409 REFERENCE_ID_EXISTS`) and the `422` acceptance rejections of 02 section 6.4.\nA conversation outside the key's inbox scope answers 404.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationReplyRequest'
      responses:
        200:
          description: 'Dry run only. The would-be message plus the non-fatal warnings; nothing was written.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageDryRunResponse'
        202:
          description: 'The message, queued, plus the non-fatal warnings.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: '`REFERENCE_ID_EXISTS` (`details.message_id`, `details.message`), `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /devices:
