            format: date
        -
          name: channel_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: inbox_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: channel_type
          in: query
          schema:
            type: string
            enum:
              - android_sim
              - whatsapp_evolution
              - telegram_bot
        -
          name: group_by
          in: query
          description: 'Default `none`.'
          schema:
            type: string
            enum:
              - none
              - channel
              - inbox
              - channel_type
        -
          name: limit
          in: query
          description: 'Grouped results only. 1 to 1,000 rows, default 200.'
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'Daily counters.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - timezone
                  - from
                  - to
                  - group_by
                  - data
                  - next_cursor
