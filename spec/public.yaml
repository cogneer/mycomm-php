        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-endpoints/{id}/replay':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: webhookDeliveries.bulkReplay
      tags:
        - Webhooks
      summary: "Bulk replay an endpoint's deliveries"
      description: "Requires `webhooks:write`. Replays, oldest first and at most 10,000 per call, every delivery of the endpoint\nin `status` (default `dead`) created inside the optional window. Deliveries whose payload was removed after\n30 days are skipped.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - failed
                    - delivered
                    - dead
                created_after:
                  type: string
                  format: date-time
                created_before:
                  type: string
                  format: date-time
      responses:
        202:
          description: 'How many deliveries were queued again.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - replayed
                properties:
                  replayed:
                    type: integer
                    minimum: 0
                    maximum: 10000
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-deliveries/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: webhookDeliveries.get
      tags:
        - Webhooks
      summary: 'Get a delivery'
      description: "Requires `webhooks:write`. `payload` is the exact signed body (`null` after 30 days); `last_response_excerpt`\nis the first 4 KB of the receiver's last response body.\n"
      responses:
        200:
          description: 'The delivery.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-deliveries/{id}/replay':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: webhookDeliveries.replay
      tags:
        - Webhooks
      summary: 'Replay a delivery'
      description: "Requires `webhooks:write`. Re-sends the stored payload now with a fresh signature and timestamp and the same\nevent `id`; status goes back to `pending` and attempts reset. `409 INVALID_STATE` when the payload was\nremoved after 30 days.\n"
      responses:
        202:
          description: 'The delivery, now pending.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  /webhook-endpoints:
    get:
      operationId: webhookEndpoints.list
      tags:
        - Webhooks
      summary: 'List webhook endpoints'
      description: "Requires `webhooks:write` (03 section 3.12). Secrets are never returned here. A restricted key sees only\nendpoints whose `inbox_ids` is set and inside its scope (03 section 2.3).\n"
      parameters:
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of endpoints.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
                  next_cursor:
                    type:
                      - string
                      - 'null'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: webhookEndpoints.create
      tags:
        - Webhooks
      summary: 'Create a webhook endpoint'
      description: "Requires `webhooks:write`. The `url` must be `https`, carry no credentials and resolve only to public\naddresses. `events` empty or omitted means every event except the opt-in ones. `inbox_ids` and\n`channel_types` `null` mean all. At most 20 endpoints per account. A restricted key's endpoint defaults to\n(and must stay inside) its inboxes, takes the key's channel types and cannot include managed accounts.\nThe `secret` is shown once, in this response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  maxLength: 2048
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                events:
                  oneOf:
                    -
                      type: array
                      items:
                        type: string
                    -
                      type: 'null'
                inbox_ids:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/Uuid'
                    -
                      type: 'null'
                channel_types:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                include_managed_accounts:
                  type: boolean
                  description: "Also receive the events of every managed account (03 section 4.3). Only on an approved partner's\nown account, with `inbox_ids` `null`, and never with a restricted key.\n"
      responses:
        201:
          description: 'The new endpoint, including its `secret`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/WebhookEndpoint'
                  -
                    type: object
                    required:
                      - secret
                    properties:
                      secret:
                        type: string
                        description: 'The signing secret; returned only here and by rotate-secret.'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-endpoints/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: webhookEndpoints.get
      tags:
        - Webhooks
      summary: 'Get a webhook endpoint'
      description: "Requires `webhooks:write`. Never returns the secret. `404` outside a restricted key's scope."
      responses:
        200:
          description: 'The endpoint.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: webhookEndpoints.update
      tags:
        - Webhooks
      summary: 'Update a webhook endpoint'
      description: "Requires `webhooks:write`. Only the fields sent change. `active: true` re-enables a disabled endpoint and\nresets its failure counters. An endpoint with `include_managed_accounts` keeps `inbox_ids` `null`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  maxLength: 2048
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                events:
                  oneOf:
                    -
                      type: array
                      items:
                        type: string
                    -
                      type: 'null'
                inbox_ids:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/Uuid'
                    -
                      type: 'null'
                channel_types:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                include_managed_accounts:
                  type: boolean
                  description: "Only on an approved partner's own account, with `inbox_ids` `null`, and never with a restricted\nkey.\n"
                active:
                  type: boolean
      responses:
        200:
          description: 'The updated endpoint.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: webhookEndpoints.delete
      tags:
        - Webhooks
      summary: 'Delete a webhook endpoint'
      description: 'Requires `webhooks:write`. Pending deliveries are dropped.'
      responses:
        204:
          description: 'The endpoint is deleted.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-endpoints/{id}/rotate-secret':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: webhookEndpoints.rotateSecret
      tags:
        - Webhooks
      summary: "Rotate a webhook endpoint's secret"
      description: "Requires `webhooks:write`. The old secret stays valid as the previous secret for\n`previous_secret_valid_seconds` (0 to 86400, default 86400); during the overlap every delivery carries\nboth signatures. Rotating again replaces the previous secret.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                previous_secret_valid_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
      responses:
        200:
          description: 'The new secret, shown once.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - previous_secret_expires_at
                properties:
                  secret:
                    type: string
                  previous_secret_expires_at:
                    $ref: '#/components/schemas/Timestamp'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/webhook-endpoints/{id}/test':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: webhookEndpoints.test
      tags:
        - Webhooks
      summary: 'Send a test ping'
      description: "Requires `webhooks:write`. Sends a `ping` event now and waits up to 10 s for the answer. Works on\ndisabled endpoints; a failed ping is not retried.\n"
      responses:
        200:
          description: 'The ping outcome.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - delivery_id
                  - success
                  - status_code
                  - response_ms
                  - error
                properties:
                  delivery_id:
                    $ref: '#/components/schemas/Uuid'
                  success:
                    type: boolean
                  status_code:
                    type:
                      - integer
                      - 'null'
                  response_ms:
                    type:
                      - integer
                      - 'null'
                  error:
                    type:
                      - string
                      - 'null'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
webhooks:
  contact.created:
    post:
      operationId: webhook.contact.created
      tags:
        - Webhooks
      summary: contact.created
      description: 'A contact was created (API, portal, import, or inbound from a new address). `data.contact` is the contact resource (03 section 3.4).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookContactCreated'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  contact.updated:
    post:
      operationId: webhook.contact.updated
      tags:
        - Webhooks
      summary: contact.updated
      description: 'Fields, identities, groups or the merge target of a contact changed; a bulk import emits one event per changed contact. `data.changed` names what changed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookContactUpdated'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  contact.deleted:
    post:
      operationId: webhook.contact.deleted
      tags:
        - Webhooks
      summary: contact.deleted
      description: 'A contact was soft-deleted, erased (`erased: true`; nothing of it remains) or merged into another contact (`merged_into`). The data carries ids only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookContactDeleted'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  import.completed:
    post:
      operationId: webhook.import.completed
      tags:
        - Webhooks
      summary: import.completed
      description: 'An import finished (any type; a user cancel emits nothing). `data.import` is the import resource (03 section 3.9) with its totals. `error_report_url` is signed for 15 minutes from when the event was rendered, so a later retry or replay may hold an expired URL; `GET /v1/imports/{id}` signs a fresh one.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookImportCompleted'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  import.failed:
    post:
      operationId: webhook.import.failed
      tags:
        - Webhooks
      summary: import.failed
      description: 'An import failed; `data.import.error` says why. Same shape as `import.completed`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookImportFailed'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  export.completed:
    post:
      operationId: webhook.export.completed
      tags:
        - Webhooks
      summary: export.completed
      description: 'An export file is ready. `data.export` is the export resource (03 section 3.9) with `url: null`: fetch the signed download URL with `GET /v1/exports/{id}`. A failed export emits nothing; poll the export instead.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookExportCompleted'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  channel.connected:
    post:
      operationId: webhook.channel.connected
      tags:
        - Webhooks
      summary: channel.connected
      description: 'A number finished verification and is `active`. `data.channel` is the channel resource (03 section 3.11.4).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookChannelConnected'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  channel.verification_failed:
    post:
      operationId: webhook.channel.verification_failed
      tags:
        - Webhooks
      summary: channel.verification_failed
      description: 'Verification failed after 3 attempts, or at once for `address_in_use` and `declined_on_device`. `data.reason` is the `failure_reason` of the verification.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookChannelVerificationFailed'
      responses:
        2XX:
          description: 'Any 2xx response acknowledges the delivery (03 section 5.5).'
  channel.disconnected:
    post:
      operationId: webhook.channel.disconnected
      tags:
