        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: "404 NOT_FOUND: the resource is absent, in another account, or outside the key's scope."
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: '405 METHOD_NOT_ALLOWED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: '409 conflict: IDEMPOTENCY_KEY_REUSED, INVALID_STATE, NAME_TAKEN and the other 409 codes of 03 section 2.6.1.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: '413 PAYLOAD_TOO_LARGE.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: '422 VALIDATION_FAILED (`details.fields`) or a specific business-rule code of 03 section 2.6.1.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            anyOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/Error'
    RateLimited:
      description: '429 RATE_LIMITED. Wait `Retry-After` seconds.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: '500 INTERNAL_ERROR. Safe to retry with the same `Idempotency-Key`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: '503 SERVICE_UNAVAILABLE. Honour `Retry-After`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ChannelActionConflict:
      description: '409 INVALID_STATE `{status, allowed_from}`, or IDEMPOTENCY_KEY_REUSED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ChannelActionErrorInvalidState'
              -
                $ref: '#/components/schemas/ChannelActionErrorIdempotency'
    SimConnectConflict:
      description: '409 CHANNEL_ADDRESS_IN_USE (the number is active on another account; no SMS is sent and no channel is created) or SIM_ALREADY_CONNECTED `{channel_id}`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ChannelConnectErrorGeneric'
              -
                $ref: '#/components/schemas/ChannelConnectErrorSimAlreadyConnected'
    SimConnectUnprocessable:
      description: '422 VALIDATION_FAILED, ADDRESS_REQUIRED, SIM_NOT_PRESENT, DEVICE_NOT_ACTIVE, INVALID_NUMBER `{input}`, VERIFICATION_LIMIT_REACHED `{retry_after_seconds}`, COUNTRY_NOT_ENABLED `{country_iso}`, DEVICE_SIM_LIMIT `{reason, sims_30_days}`, CHANNEL_TYPE_NOT_ALLOWED `{type}` or ACCOUNT_THROTTLED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/ChannelConnectErrorGeneric'
              -
                $ref: '#/components/schemas/ChannelConnectErrorInvalidNumber'
              -
                $ref: '#/components/schemas/ChannelConnectErrorCountryNotEnabled'
              -
                $ref: '#/components/schemas/ChannelConnectErrorDeviceSimLimit'
              -
                $ref: '#/components/schemas/ChannelConnectErrorVerificationLimit'
              -
                $ref: '#/components/schemas/ChannelConnectErrorTypeNotAllowed'
    ChannelVerifyConflict:
      description: '409 INVALID_STATE `{status, allowed_from}`, CHANNEL_ADDRESS_IN_USE or SIM_ALREADY_CONNECTED `{channel_id}`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ChannelConnectErrorGeneric'
              -
                $ref: '#/components/schemas/ChannelConnectErrorSimAlreadyConnected'
              -
                $ref: '#/components/schemas/ChannelConnectErrorInvalidState'
    ChannelVerifyUnprocessable:
      description: '422 VALIDATION_FAILED, SIM_NOT_PRESENT, INVALID_NUMBER `{input}`, VERIFICATION_LIMIT_REACHED `{retry_after_seconds}`, COUNTRY_NOT_ENABLED `{country_iso}`, DEVICE_SIM_LIMIT `{reason, sims_30_days}` or ACCOUNT_THROTTLED.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/ChannelConnectErrorGeneric'
              -
                $ref: '#/components/schemas/ChannelConnectErrorInvalidNumber'
              -
                $ref: '#/components/schemas/ChannelConnectErrorCountryNotEnabled'
              -
                $ref: '#/components/schemas/ChannelConnectErrorDeviceSimLimit'
              -
                $ref: '#/components/schemas/ChannelConnectErrorVerificationLimit'
    ChannelRatePolicyUnprocessable:
      description: '422 VALIDATION_FAILED, ABOVE_PLATFORM_CEILING `{field, value, ceiling, reason}` (for `interval_ms.min` and `interval_ms.max`, `value` and `ceiling` are waits in milliseconds and `ceiling` is the shortest wait allowed) or RISK_ACKNOWLEDGEMENT_REQUIRED `{risk, exceeds}`.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/ValidationError'
              -
                $ref: '#/components/schemas/ChannelRatePolicyErrorAboveCeiling'
              -
                $ref: '#/components/schemas/ChannelRatePolicyErrorRiskAcknowledgement'
paths:
  /account:
    get:
      operationId: account.get
      tags:
        - Account
      summary: 'Get the account'
      description: "The account the key belongs to (03 section 3.15). Needs no ability and also works for a\nsuspended account. `settings` is `accounts.settings` without `notifications` and\n`onboarding`, which concern portal users only.\n"
      responses:
        200:
          description: 'The account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: account.update
      tags:
        - Account
      summary: 'Update the account'
      description: "Requires `account:write`. `settings` is deep-merged: arrays are replaced whole, language\nmaps merge key by key and `null` removes a language. `settings.limits` is read-only for\naccount keys (`422 VALIDATION_FAILED`). Changes are audit-logged.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        200:
          description: 'The updated account.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /api-keys:
    get:
      operationId: apiKeys.list
      tags:
        - 'API keys'
      summary: 'List API keys'
      description: "Requires `keys:write` (03 section 3.13). Revoked keys are hidden unless `revoked=true`. The token is\nnever returned here.\n"
      parameters:
        -
          name: inbox_id
          in: query
          description: 'Keys whose scope lists this inbox.'
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: restricted
          in: query
          description: '`true` for keys limited to inboxes or channel types, `false` for unrestricted keys.'
          schema:
            type: boolean
        -
          name: revoked
          in: query
          description: 'Default `false`.'
          schema:
            type: boolean
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of keys.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  next_cursor:
                    type:
                      - string
                      - 'null'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: apiKeys.create
      tags:
        - 'API keys'
      summary: 'Create an API key'
      description: "Requires `keys:write`. Abilities default per 03 section 2.2, must be a subset of the calling key's,\nand a restricted key cannot hold the abilities marked with a cross there. A restricted caller can\ncreate keys only inside its own scope. `partner` keys are never created here. The `token` is shown\nonce, in this response.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                inbox_ids:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/Uuid'
                    -
                      type: 'null'
                  description: '`null` or omitted for all inboxes.'
                channel_types:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                  description: '`null` or omitted for all channel types, for example `["android_sim"]`.'
                abilities:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      items:
                        type: string
                    -
                      type: 'null'
                allowed_ips:
                  oneOf:
                    -
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: string
                    -
                      type: 'null'
                  description: 'IPv4/IPv6 addresses or CIDR ranges.'
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
      responses:
        201:
          description: 'The new key, including its `token`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/ApiKey'
                  -
                    type: object
                    required:
                      - token
                    properties:
                      token:
                        type: string
                        description: 'The plaintext key; returned only here.'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/api-keys/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    delete:
      operationId: apiKeys.revoke
      tags:
        - 'API keys'
      summary: 'Revoke an API key'
      description: "Requires `keys:write`. Revokes immediately; the key's next call is `401`. Revoking a revoked key is a no-op."
      responses:
        204:
          description: 'The key is revoked.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}':
    patch:
      operationId: channels.update
      tags:
        - Channels
      summary: 'Update the settings of a channel'
      description: "Requires `channels:write` (03 section 3.11.4); a key restricted to inboxes never holds it. Changes only the keys\nsent. `allowed_destination_countries` is `null` (the channel's own country only, the default) or a list of\nISO 3166-1 alpha-2 codes that must contain the channel's own country, else `422 VALIDATION_FAILED`; codes are\nstored upper case. Adding another country is an explicit opt-in on the number and is audited as\n`channel.destinations.updated`. `skip_business_senders: true` makes the phone stop uploading inbound from short\ncodes and alphanumeric senders (operator-notice senders are always uploaded). `404` when the channel is not\nfound in the account.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      responses:
        200:
          description: 'The channel with its new settings.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: channels.get
      tags:
        - Channels
      summary: 'Get a channel'
      description: "Requires `channels:read`. The full state of a number: status, the resolved `capabilities` (07 section 4.2),\nthe rate policy with its suggestion and ceiling, warm-up, the SIM safety score, the queue and rolling usage\ncounts and the latest verification (03 section 3.11.4). `404` when the channel is outside the key's scope.\n"
      responses:
        200:
          description: 'The channel.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}/pause':
    post:
      operationId: channels.pause
      tags:
        - Channels
      summary: 'Pause a channel'
      description: "Requires `channels:write`. `active` → `paused` with `pause_reason: owner`. Messages are still accepted and wait\nuntil the channel is resumed. Emits `channel.paused`. A channel in any other state is `409 INVALID_STATE`\nwith `allowed_from: [active]`.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 'The paused channel.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/ChannelActionConflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}/resume':
    post:
      operationId: channels.resume
      tags:
        - Channels
      summary: 'Resume a paused channel'
      description: "Requires `channels:write`. `paused` → `active` for `pause_reason` `owner`, `auto:failure_streak` and `auto:quota`\n(after the SIM was recharged); `auto:health_critical` also once the SIM safety band is back to `fair` or better.\n`auto:sim_missing` and `device_revoked` resume through the SIM returning or re-verification, `auto:quarantine`\nthrough a successful test message or MyComm support, `admin` and `account_suspended` only through MyComm: these\nanswer `409 INVALID_STATE` with the channel's `status`, as does a channel that is not paused. Emits\n`channel.resumed`.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 'The active channel.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/ChannelActionConflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}/disconnect':
    post:
      operationId: channels.disconnect
      tags:
        - Channels
      summary: 'Disconnect a channel'
      description: "Requires `channels:write`. → `disconnected` with `disconnect_reason: owner`; the number is released for use\nelsewhere, queued outbound messages fail with `CHANNEL_DISCONNECTED`, inboxes and history stay readable and\nsends get `CHANNEL_INACTIVE`. Emits `channel.disconnected`. A `pending_verification` channel that never\nconnected is deleted instead (`204`). An already disconnected channel is `409 INVALID_STATE`.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 'The disconnected channel.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        204:
          description: 'The channel was waiting for its first verification and is deleted.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/ChannelActionConflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/devices/{id}/sims/{sim_id}/connect':
    post:
      operationId: channels.connectSim
      tags:
        - Channels
      summary: 'Connect a SIM'
      description: "Requires `channels:write` (03 section 3.11.3). Creates a channel in `pending_verification` for the SIM and asks\nthe person holding the phone to confirm the connection; while the prompt is open `verification.step` is\n`awaiting_confirmation` and `verification.confirmation.status` is `pending`. After the tap the phone texts a\n6-digit code to the number and catches it. The outcome arrives as `channel.connected` or\n`channel.verification_failed` and on `GET /v1/channels/{id}`. `address` is optional when the SIM reports its\nnumber or the platform's inbound probe is configured; otherwise `422 ADDRESS_REQUIRED`. A number already active\non a channel of the same account is moved to this SIM when verification succeeds. `404` when the phone or SIM is\nnot found in the account or outside the key's scope.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type:
                    - string
                    - 'null'
                  maxLength: 40
                  description: "The SIM's number, national or international form."
                name:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
                  description: 'Channel label; default the formatted number.'
      responses:
        202:
          description: 'The channel, in `pending_verification`, with the verification that was started.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/SimConnectConflict'
        422:
          $ref: '#/components/responses/SimConnectUnprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The phone.'
        schema:
          $ref: '#/components/schemas/Uuid'
      -
        name: sim_id
        in: path
        required: true
        description: 'A SIM of that phone (`GET /v1/devices/{id}/sims`).'
        schema:
          $ref: '#/components/schemas/Uuid'
  '/channels/{id}/verify':
    post:
      operationId: channels.verify
      tags:
        - Channels
      summary: 'Retry the verification of a channel'
      description: "Requires `channels:write` (03 section 3.11.4). Retries the verification of a `pending_verification` channel: a\nnew attempt after a failed one, or a new verification after a `failed` or `expired` one, optionally with a\ncorrected `address`. An attempt that is still running is left as it is. It also re-verifies a channel paused with\n`auto:sim_missing` on the SIM now in its phone; the channel keeps its number and stays paused until the\nverification succeeds. A channel in any other state is `409 INVALID_STATE`. The checks are those of connect.\n`422 VERIFICATION_LIMIT_REACHED` says in `retry_after_seconds` when to try again.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type:
                    - string
                    - 'null'
                  maxLength: 40
                  description: 'A corrected number; it replaces the one the channel was started with.'
      responses:
        202:
          description: 'The channel with the latest verification.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/ChannelVerifyConflict'
        422:
          $ref: '#/components/responses/ChannelVerifyUnprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /channels:
    post:
      operationId: channels.create
      tags:
        - Channels
      summary: 'Connect a push channel'
      description: "Requires `channels:write`. Connecting a push channel (WhatsApp, Telegram) is part of v2 (07 section 5.6); v1\nanswers `422 CHANNEL_TYPE_NOT_ALLOWED` to every request, whatever its body. A SIM is connected with\n`POST /v1/devices/{id}/sims/{sim_id}/connect`.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'The channel type asked for; echoed in `details.type` of the error.'
                name:
                  type: string
                connect:
                  type: object
                  description: "The type's connect input (v2)."
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          description: '422 CHANNEL_TYPE_NOT_ALLOWED, with `details.type` when the request named a type.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectErrorTypeNotAllowed'
        429:
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: channels.list
      tags:
        - Channels
      summary: 'List channels'
      description: "Requires `channels:read`. Every channel of the account whatever its status, oldest first, unless a filter\nnarrows the list. `health_band` filters on the stored SIM safety band, so a number that was never evaluated\nmatches no band. A key restricted to inboxes sees only the channels of those inboxes (03 sections 2.3, 3.11.4).\n"
      parameters:
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - pending_verification
              - active
              - paused
              - disconnected
        -
          name: type
          in: query
          schema:
            type: string
            enum:
              - android_sim
              - whatsapp_evolution
              - telegram_bot
        -
          name: device_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        -
          name: health_band
          in: query
          schema:
            type: string
            enum:
              - good
              - fair
              - poor
              - critical
        -
          $ref: '#/components/parameters/limit'
        -
          $ref: '#/components/parameters/cursor'
      responses:
        200:
          description: 'A page of channels.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  next_cursor:
                    type:
                      - string
                      - 'null'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}/connect':
    get:
      operationId: channels.connectState
      tags:
        - Channels
      summary: 'Get the connect state of a push channel'
      description: "Requires `channels:read`. In v2 this returns the current QR code or pairing code of a connecting WhatsApp channel\n(07 section 5.6). A SIM channel has none, so v1 answers `404 NOT_FOUND` for every channel.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/channels/{id}/rate-policy':
    patch:
      operationId: channels.updateRatePolicy
      tags:
        - Channels
      summary: 'Update the rate policy of a channel'
      description: "Requires `channels:write` (03 section 3.11.4); a key restricted to inboxes never holds it. Sent keys are merged\ninto the current policy (nested objects key by key; a key sent as `null` clears it where the field allows\n`null`) and `rate_policy_source` becomes `custom`. `{\"reset_to_suggested\": true}` restores the suggestion\n(`rate_policy_source: suggested`) and clears the acknowledgement; it cannot be combined with policy fields.\nA body that changes nothing is `422 VALIDATION_FAILED`.\n\nChecks run in this order and the first failure answers:\n\n1. Shape and field bounds of 02 section 2.1, `422 VALIDATION_FAILED`: every cap at least 1 and\n   `per_min <= per_15m <= per_hour <= per_day`, `interval_ms.min >= 60000 / ceiling.per_min`,\n   `interval_ms.max` between `min` and 600000, `bulk_hours` within 07:00 to 22:00 sender-local.\n2. Every cap at or below the channel's `rate_policy_ceiling`, else `422 ABOVE_PLATFORM_CEILING` with\n   `{field, value, ceiling, reason}` (`platform`, `country`, `override_limit`, `new_account` or\n   `restricted_country`). During the first 14 days of the account the suggestion is also the shortest wait\n   allowed: `interval_ms.min` below the suggested shortest wait, or `interval_ms.max` below the suggested\n   longest wait, answers `422 ABOVE_PLATFORM_CEILING` with `reason: new_account`; for these two fields `value`\n   and `ceiling` are waits in milliseconds and `ceiling` is the shortest wait allowed. A cap above its\n   ceiling is answered first. Acknowledging the risk never lifts a ceiling. After day 14 only step 1 limits a\n   wait. `rate_policy_ceiling` itself holds caps only.\n3. The risk of the result (02 section 2.8): saving `amber` or `red` needs `acknowledge_risk: true`, again\n   whenever the risk rises above the acknowledged level, else `422 RISK_ACKNOWLEDGEMENT_REQUIRED` with\n   `{risk, exceeds}`.\n\nSaving sets `acknowledged_risk_at` and is audited as `channel.rate_policy.updated`. While the SIM safety band is\n`poor` or `critical` a custom policy is also capped at the suggestion times the band factor (08 section 3.6); the\nstored policy is unchanged and applies again when the band recovers. `404` when the channel is not found in the\naccount.\n"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRatePolicyUpdate'
      responses:
        200:
          description: 'The channel with its refreshed rate policy, source, risk and ceiling.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ChannelRatePolicyUnprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  /channels/types:
    get:
      operationId: channels.types
      tags:
        - Channels
      summary: 'List channel types'
      description: "Requires `channels:read` (03 section 3.11.4, 07 section 5.6). Every channel type with what this account can\nconnect and what each type can do, so a partner UI adapts without hard-coding SMS. `available` is `true` when\nthe type is enabled on the platform and allowed by the account's `settings.channels.allowed_types`; a type that\nhas not shipped yet carries `available_from`. In v1 only `android_sim` is available. The list is about the\naccount, not an inbox, so a key restricted to inboxes gets the full answer. Not paginated.\n"
      responses:
        200:
          description: 'Every channel type.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelTypeInfo'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
  /contact-fields:
    get:
      operationId: contactFields.list
      tags:
        - 'Contact fields'
      summary: 'List custom contact field definitions'
      description: "Requires `contacts:read`. All definitions of the account ordered by `position`; not paginated\n(03 section 3.4.2).\n"
      responses:
        200:
          description: 'Every definition, ordered by `position`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactField'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: contactFields.create
      tags:
        - 'Contact fields'
      summary: 'Create a custom contact field'
      description: "Requires `contacts:write`. `key` matches `^[a-z][a-z0-9_]{0,39}$` and is not reserved\n(`first_name`, `last_name`, `full_name`, `email`, `phone`, `language`, `group`); `key` and `type`\ncannot change later. `options` is required for `select` and refused for other types. An account has\nat most 100 fields. `position` defaults to after the last field.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - label
                - type
              properties:
                key:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,39}$'
                label:
                  type: string
                  minLength: 1
                  maxLength: 60
                type:
                  type: string
                  enum:
                    - text
                    - number
                    - date
                    - boolean
                    - select
                options:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                position:
                  type: integer
                  minimum: 0
      responses:
        201:
          description: 'The new definition.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactField'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/contact-fields/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    patch:
      operationId: contactFields.update
      tags:
        - 'Contact fields'
      summary: 'Update a custom contact field'
      description: "Requires `contacts:write`. Changes `label`, `options` (select fields only) and `position`. Sending\n`key` or `type` is refused with `422`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 60
                options:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                position:
                  type: integer
                  minimum: 0
      responses:
        200:
          description: 'The updated definition.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactField'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: contactFields.delete
      tags:
        - 'Contact fields'
      summary: 'Delete a custom contact field'
      description: "Requires `contacts:write`. Removes the definition and its key from every contact. Refused with `409`\n`INVALID_STATE` and `details.used_by` (the users of the field, each `{type, id, name}`) while a smart-list\nfilter references it; edit or delete those smart lists first.\n"
      responses:
        204:
          description: 'The definition is deleted.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/contacts/{id}/identities':
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: contacts.identities.create
      tags:
        - Contacts
      summary: 'Add an identity to a contact'
      description: "Requires `contacts:write` (03 section 3.4.1). `type` is `phone` in v1 and the address is normalised to E.164\nwith the account country (`422 INVALID_NUMBER`); `whatsapp` and `telegram` identities are added with their\nchannels (`422 IDENTITY_TYPE_UNAVAILABLE` before). `sender_id` identities are created by MyComm from inbound\nonly (`422 INVALID_NUMBER`). A number another contact holds answers `409 IDENTITY_TAKEN` with\n`details.contact_id`; one this contact already holds answers `200` and creates nothing. A contact has at most\n10 identities. `is_primary: true` makes it the primary (the previous primary is unset and an automatic\n`display_name` follows it). Emits `contact.updated`. An opt-out of the number is never cleared.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactIdentityCreateRequest'
      responses:
        200:
          description: 'The contact already holds this identity; nothing was created.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIdentity'
        201:
          description: 'The new identity.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIdentity'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: '`IDENTITY_TAKEN` (`details.contact_id`), `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
  '/contacts/{id}/identities/{identity_id}':
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
      -
        name: identity_id
        in: path
        required: true
        description: 'An identity of that contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
    patch:
      operationId: contacts.identities.update
      tags:
        - Contacts
      summary: 'Make an identity primary'
      description: "Requires `contacts:write` (03 section 3.4.1). Only `{\"is_primary\": true}`: the identity becomes the contact's\nprimary, the previous primary is unset and an automatic `display_name` (one the owner did not set) follows the\nnew primary. The type and address of an identity never change (`422 VALIDATION_FAILED`). A `sender_id` identity\nis receive-only and cannot be made primary (`422 INVALID_NUMBER`). Emits `contact.updated` when something\nchanged.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactIdentityUpdateRequest'
      responses:
        200:
          description: 'The identity, now primary.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIdentity'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: contacts.identities.delete
      tags:
        - Contacts
      summary: 'Remove an identity'
      description: "Requires `contacts:write` (03 section 3.4.1). `409 INVALID_STATE` for the contact's last identity or an identity\nwith conversations (delete the contact instead). A removed primary is replaced by the earliest identity left,\nand an automatic `display_name` follows it. Suppressions and consent of the address are kept, so an opt-out\nstill applies when the number comes back. Emits `contact.updated`.\n"
      responses:
        204:
          description: 'The identity is removed.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/RateLimited'
  '/contacts/{id}/identities/{identity_id}/block':
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
      -
        name: identity_id
        in: path
        required: true
        description: 'An identity of that contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: contacts.identities.block
      tags:
        - Contacts
      summary: 'Block an identity account-wide'
      description: "Requires `contacts:write` (03 section 3.4.1, 02 section 11.6). Sets `blocked_at` for every inbox and channel of\nthe account. New outbound to the identity is refused (`CONTACT_BLOCKED`) and its `queued` outbound is cancelled\n(`message.cancelled`, reason `contact_blocked`). Inbound is still stored but is not counted as unread, runs no\nautomation, sends no notification and emits no `message.received` webhook; opt-out and opt-in keywords still\napply. Campaign recipients are skipped (`blocked`). Any identity can be blocked, a `sender_id` one included.\nIdempotent: blocking a blocked identity changes nothing. Emits `contact.updated`. An opt-out is neither set nor\ncleared. Send an empty JSON object `{}` as the body.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        200:
          description: 'The identity, blocked.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIdentity'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  '/contacts/{id}/identities/{identity_id}/unblock':
    parameters:
      -
        name: id
        in: path
        required: true
        description: 'The contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
      -
        name: identity_id
        in: path
        required: true
        description: 'An identity of that contact.'
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      operationId: contacts.identities.unblock
      tags:
        - Contacts
      summary: 'Unblock an identity'
      description: "Requires `contacts:write` (03 section 3.4.1). Clears `blocked_at`, account-wide. Nothing is replayed: messages\nreceived or cancelled while blocked stay as they are. Idempotent. Emits `contact.updated`. Send an empty JSON\nobject `{}` as the body.\n"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        200:
          description: 'The identity, unblocked.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactIdentity'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
  /contacts/by-identity:
    put:
      operationId: contacts.upsertByIdentity
      tags:
        - Contacts
      summary: 'Upsert a contact by phone number'
      description: "Requires `contacts:write` (03 section 3.4). Finds the contact holding `identity` (the address is normalised to\nE.164 with the account country), including a soft-deleted one, which is restored. When found, the sent fields\nare merged as in `PATCH /v1/contacts/{id}` (top-level fields replace, `null` empties one; `custom_fields` merges\nkey by key, a `null` value removes a key) and the answer is `200`; otherwise a contact is created with that\nidentity as primary and the answer is `201`. `add_to_group_ids` only adds memberships. An opt-out of the number\nis never cleared. Emits `contact.created` or `contact.updated`. This is the call integrations use to keep MyComm\ncontacts in sync with their own customer records.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpsertRequest'
      responses:
        200:
          description: 'The existing contact, updated (and restored when it was deleted).'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        201:
          description: 'The new contact.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          description: '`INVALID_NUMBER`, `IDENTITY_TYPE_UNAVAILABLE` or `VALIDATION_FAILED`; nothing was written.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          $ref: '#/components/responses/RateLimited'
  /contacts/bulk:
    post:
      operationId: contacts.bulkUpsert
      tags:
        - Contacts
      summary: 'Upsert up to 1,000 contacts'
      description: "Requires `contacts:write` (03 section 3.4). Each item has the shape of `PUT /v1/contacts/by-identity` and is\nprocessed independently, in order; the top-level `add_to_group_ids` is added for every item, together with the\nitem's own. The answer is always `200` with a `summary` and one `results[]` entry per item, also when every item\nwas rejected. A rejected item carries the error code the single upsert would answer (`INVALID_NUMBER`,\n`IDENTITY_TYPE_UNAVAILABLE`, `VALIDATION_FAILED`) and writes nothing.\n\nEnvelope problems answer `422` and nothing is processed: `BATCH_TOO_LARGE` (`details.max`, 1,000) or\n`VALIDATION_FAILED`. Larger sets go through a CSV import. `Idempotency-Key` covers the whole call.\n"
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBulkRequest'
      responses:
        200:
          description: 'Per-item results and a summary, also when every item was rejected.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactBulkResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          description: '`IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        413:
          $ref: '#/components/responses/PayloadTooLarge'
        422:
