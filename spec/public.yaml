      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '401 UNAUTHENTICATED: the key is missing, unknown, revoked or expired.'
      headers:
        MyComm-Request-Id:
          $ref: '#/components/headers/MyComm-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '403 WRONG_KEY_KIND, ABILITY_MISSING, IP_NOT_ALLOWED, ACCOUNT_CONTEXT_INVALID, ACCOUNT_SUSPENDED, ACCOUNT_PENDING_DELETION, PARTNER_ACCESS_REVOKED or PARTNER_KEY_RESTRICTED.'
