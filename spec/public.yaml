          schema:
            type: string
            enum:
              - '-created_at'
              - created_at
            default: '-created_at'
      responses:
        200:
          description: 'A page of messages.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                  -
