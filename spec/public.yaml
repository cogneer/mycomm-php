          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        429:
          $ref: '#/components/responses/RateLimited'
      operationId: imports.create
      tags:
        - Imports
      summary: 'Upload an import'
      description: "The required ability depends on `type` (03 section 3.9): `contacts_csv` needs `contacts:write`, `suppressions_csv`\nneeds `suppressions:write`. `multipart/form-data` with `type`, `file` (CSV UTF-8 with a header row, at most 20 MB and\n200,000 rows) and `options`, a JSON string. For `contacts_csv`, `options.mapping` maps a column to `phone`,\n`first_name`, `last_name`, `full_name` (split at the last space), `email`, `timezone`, `language`, `group` or\n`custom.<key>`; `existing` is `fill_empty` (default), `overwrite` or `skip`; `consent_assertion` is\n`{asserted: true, source}`. For `suppressions_csv`, `options.mapping` must map one column to `phone`; `reason` is\n`import` (default) or `dnc`. The import goes straight from `uploaded` to `queued`; poll `GET /v1/imports/{id}` or wait for\nthe `import.completed` / `import.failed` webhook. The file is private data and is never logged.\n\nErrors: `422 VALIDATION_FAILED` (unknown `type`, bad `options`, a CSV that is empty, too large, too long or unreadable),\n`403 ABILITY_MISSING`.\n"
    get:
