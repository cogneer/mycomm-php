  /exports:
    post:
      operationId: exports.create
      tags:
        - Exports
      summary: 'Request an export'
      description: "The required ability depends on `type` (03 section 3.9): `messages_csv` needs `reports:read`, `contacts_csv` and\n`contact_json` need `contacts:read`, `campaign_report` needs `campaigns:read`, `account_zip` needs `account:write`.\n`messages_csv` takes the `GET /v1/messages` filters as `params`; `created_after` and `created_before` are required\nand at most 366 days apart. A key restricted to inboxes exports only its inboxes. The export is built\nasynchronously: poll `GET /v1/exports/{id}` or wait for the `export.completed` webhook.\n\nErrors: `422 VALIDATION_FAILED` (unknown `type` or invalid `params`), `403 ABILITY_MISSING`.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  $ref: '#/components/schemas/ExportType'
                params:
                  type: object
                  additionalProperties: true
      responses:
        202:
          description: 'The export, `queued`.'
          headers:
            MyComm-Request-Id:
              $ref: '#/components/headers/MyComm-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
